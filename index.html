<!DOCTYPE html>
<html lang="zh-TW">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>JianpuTool</title>


<style>

body {
    font-family: Arial, sans-serif;
    text-align: center;
    margin-top: 80px;
    background: #f5f5f5;
}


.container {

    background:white;
    width:400px;
    margin:auto;
    padding:30px;
    border-radius:15px;
    box-shadow:0 0 10px #ccc;

}


h1 {

    color:#333;

}


input {

    margin:20px;

}


button {

    background:#4CAF50;
    color:white;
    border:none;
    padding:12px 30px;
    font-size:16px;
    border-radius:8px;
    cursor:pointer;

}


button:hover {

    background:#45a049;

}


#status {

    margin-top:20px;
    color:#555;

}

</style>


</head>


<body>


<div class="container">


<h1>
🎵 JianpuTool
</h1>


<h3>
MP3 → 簡譜 PDF
</h3>


<form 
action="/upload"
method="post"
enctype="multipart/form-data">


<input 
type="file"
name="file"
accept=".mp3,.wav"
required>


<br>


<button type="submit">

開始轉換

</button>


</form>


<p id="status">

支援 MP3 / WAV

</p>


</div>


</body>


</html>

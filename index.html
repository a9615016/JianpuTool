<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>JianpuTool - MP3轉簡譜</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin-top: 80px;
        }

        .box {
            width: 400px;
            margin: auto;
            padding: 30px;
            border: 1px solid #ccc;
            border-radius: 10px;
        }

        button {
            margin-top: 20px;
            padding: 12px 30px;
            font-size: 18px;
            cursor: pointer;
        }

        input {
            margin-top: 20px;
        }
    </style>

</head>


<body>


<div class="box">

<h1>🎵 JianpuTool</h1>

<h3>
MP3 → 人聲 → MIDI → 簡譜 PDF
</h3>


<form 
action="/convert" 
method="post" 
enctype="multipart/form-data">


<input 
type="file"
name="file"
accept=".mp3,.wav"
required>


<br>


<button type="submit">
開始轉換
</button>


</form>


</div>


</body>

</html>

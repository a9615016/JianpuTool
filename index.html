<!DOCTYPE html>
<html lang="zh-TW">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>JianpuTool - MP3轉簡譜</title>

<style>

body {
    font-family: Arial, "Microsoft JhengHei", sans-serif;
    background: #f5f5f5;
    text-align: center;
    padding-top: 80px;
}


.container {
    background: white;
    width: 420px;
    margin: auto;
    padding: 35px;
    border-radius: 15px;
    box-shadow: 0 0 15px #ccc;
}


h1 {
    color: #333;
}


input[type=file] {

    margin: 20px;
    padding: 10px;

}


button {

    background: #2196F3;
    color:white;

    border:none;

    padding:12px 30px;

    font-size:16px;

    border-radius:8px;

    cursor:pointer;

}


button:hover {

    background:#1976D2;

}


#status {

    margin-top:20px;

    color:#555;

}

</style>

</head>


<body>


<div class="container">


<h1>🎵 JianpuTool</h1>

<h3>
MP3 → 人聲 → MIDI → 簡譜 PDF
</h3>


<form id="uploadForm">


<input 
    type="file"
    id="file"
    name="file"
    accept=".mp3,.wav"
    required
>


<br>


<button type="submit">
開始轉換
</button>


</form>



<div id="status"></div>


</div>



<script>


const form = document.getElementById("uploadForm");

const status = document.getElementById("status");


form.addEventListener(
"submit",
async function(e){


e.preventDefault();


let file =
document.getElementById("file").files[0];


if(!file){

    alert("請選擇 MP3");

    return;

}



let data = new FormData();

data.append(
    "file",
    file
);



status.innerHTML =
"⏳ 上傳中，開始分析音樂...";



try{


let response =
await fetch(
    "/convert",
    {
        method:"POST",
        body:data
    }
);



if(!response.ok){

    let text =
    await response.text();

    throw new Error(text);

}



let blob =
await response.blob();



let url =
window.URL.createObjectURL(blob);



let a =
document.createElement("a");


a.href=url;

a.download="jianpu.pdf";

a.click();



status.innerHTML =
"✅ 完成！PDF 已產生";


}

catch(error){


console.log(error);


status.innerHTML =
"❌ 失敗<br>" + error;


}


});

</script>


</body>

</html>
